name: Partial Test

on:
  workflow_dispatch:   # 手動実行用

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: コードを取得
        uses: actions/checkout@v3

      - name: Pythonセットアップ
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: 依存関係インストール
        run: pip install -r requirements.txt

      - name: 部分テスト実行
        run: pytest tests/test_partial.py
